<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoofDesk AI: walkthrough video</title>
<meta name="description" content="A walkthrough of RoofDesk AI: the live chat, the dashboard, the outreach engine and the automations behind it.">
<meta property="og:title" content="RoofDesk AI: walkthrough video">
<meta property="og:description" content="An AI assistant that answers roofing enquiries, qualifies leads and books inspections. See how it works.">
<meta property="og:type" content="video.other">
<meta property="og:image" content="https://roofdeskai.com/showcase-poster.jpg">
<meta property="og:video" content="https://roofdeskai.com/showcase.mp4">
<meta property="og:video:type" content="video/mp4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --tape:#FFC800; --case:#14120B; --ink-soft:#3D3200; --ease-out:cubic-bezier(.23,1,.32,1); --display:"Big Shoulders Display","Arial Narrow",sans-serif }
  * { box-sizing:border-box }
  body { margin:0; font:17px/1.55 "Schibsted Grotesk",system-ui,sans-serif; color:var(--case); background:var(--tape) }
  ::selection { background:var(--case); color:var(--tape) }
  .tape { height:34px; border-bottom:4px solid var(--case); background:
      linear-gradient(90deg,var(--case) 3px,transparent 3px) 0 0/120px 28px repeat-x,
      linear-gradient(90deg,var(--case) 2px,transparent 2px) 0 0/60px 18px repeat-x,
      linear-gradient(90deg,var(--case) 2px,transparent 2px) 0 0/12px 10px repeat-x, var(--tape) }
  .wrap { max-width:1000px; margin:0 auto; padding-inline:20px }
  header .wrap { padding-block:16px }
  .brand { display:inline-flex; align-items:center; gap:12px; font:800 28px/1 var(--display); text-transform:uppercase; color:var(--case); text-decoration:none }
  .brand img { width:36px; height:36px }
  main { padding-block:20px 56px }
  h1 { font:900 clamp(40px,7vw,76px)/.92 var(--display); text-transform:uppercase; margin:0 0 14px; text-wrap:balance }
  p { color:var(--ink-soft); margin:0 0 24px; max-width:60ch }
  video { width:100%; display:block; border-radius:12px; background:#000; box-shadow:0 30px 50px -28px rgba(20,18,11,.7) }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:28px }
  .btn { display:inline-block; font-weight:700; background:var(--case); color:var(--tape); border-radius:6px; padding:14px 24px; text-decoration:none; transition:transform .16s var(--ease-out) }
  .btn:active { transform:scale(.97) }
  .btn.alt { background:transparent; color:var(--case); box-shadow:inset 0 0 0 3px var(--case) }
  a:focus-visible, video:focus-visible { outline:3px solid var(--case); outline-offset:3px }
  footer { color:var(--ink-soft); font-size:14px; padding-block:8px 36px }
  footer a { color:inherit }
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<header><div class="wrap"><a class="brand" href="/"><img src="logo.svg?v=2" alt="">RoofDesk AI</a></div></header>
<main class="wrap">
  <h1>See how RoofDesk AI works</h1>
  <p>A live chat that qualifies a lead and books an inspection, the dashboard behind it, the outreach engine, and the automations that run it. Dashboard data in the video is synthetic.</p>
  <video controls preload="metadata" poster="showcase-poster.jpg" playsinline>
    <source src="showcase.mp4" type="video/mp4">
    Your browser can't play this video. <a href="showcase.mp4">Download it</a>.
  </video>
  <div class="row">
    <a class="btn" href="/#demo">Try the live demo</a>
    <a class="btn alt" href="/#pilot">Get a free pilot</a>
  </div>
</main>
<footer class="wrap">RoofDesk AI · <a href="mailto:hello@roofdeskai.com">hello@roofdeskai.com</a></footer>
</body>
</html>
