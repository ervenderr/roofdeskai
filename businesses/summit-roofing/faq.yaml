entries:
  - source: inspection
    text: "The roof inspection is free and takes about 45 to 60 minutes."
  - source: inspection
    text: "An inspection covers shingles, flashing, gutters and attic ventilation, and ends with a photo report."
  - source: inspection
    text: "After the inspection you get a written estimate at no cost and with no obligation."
  - source: warranty
    text: "Roof replacements carry a 10-year workmanship warranty. Roof repairs carry a 1-year workmanship warranty. Manufacturer shingle warranties are separate."
  - source: area
    text: "Summit Roofing serves Denver, Aurora, Lakewood, Arvada, Centennial and Littleton."
  - source: eligibility
    text: "Inspections are booked for property owners only. Renters need the owner to contact us."
  - source: process
    text: "Our process: free inspection, written estimate, scheduling, installation, then a final walkthrough."
  - source: timeline
    text: "A typical roof replacement takes 1 to 3 days depending on roof size."
  - source: pricing
    text: "Pricing depends on roof size, materials and condition. Exact pricing is only given in the written estimate after an inspection; we do not quote prices in chat."
  - source: hours
    text: "Inspections are available Monday to Friday between 8am and 5pm."
  - source: insurance
    text: "We provide a photo report that you can submit to your insurer. We do not file insurance claims for customers."
  - source: materials
    text: "We install asphalt shingle, metal and tile roofs."
