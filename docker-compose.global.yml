# Isolated RoofDesk Global branch stack: host ports that do not collide with the live stack.
# Use via `make g-up` (compose project roofdesk-global => separate volumes).
services:
  db:
    ports: !override ["55432:5432"]
  mailpit:
    ports: !override ["18025:8025", "11025:1025"]
  n8n:
    ports: !override ["15679:5678"]
  api:
    # host-run dashboard needs the API; loopback only
    ports: !override ["127.0.0.1:18000:8000"]
    volumes:
      - ./api:/srv/api:ro
      - ./dashboard/app:/srv/dashboard/app:ro
      - ./dashboard/components:/srv/dashboard/components:ro
      - ./dashboard/lib:/srv/dashboard/lib:ro
      - ./docs:/srv/docs
      - ./README.md:/srv/README.md
  scraper:
    ports: !override ["18081:8080"]
