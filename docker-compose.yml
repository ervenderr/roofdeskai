services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpilot}
      POSTGRES_DB: leadpilot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/outreach.sql:/docker-entrypoint-initdb.d/outreach.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://leadpilot:${POSTGRES_PASSWORD:-leadpilot}@db:5432/leadpilot
      # Ollama runs on the host (Docker on Mac has no GPU access); hosted keys are optional fallbacks.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      SENDER_ADDRESS: ${SENDER_ADDRESS:-123 Example Street, Davao City (dev)}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}  # JSON list, e.g. ["https://leadpilot.pages.dev"]
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-mailpit}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-hello@leadpilot.example}
      SENDER_NAME: ${SENDER_NAME:-The LeadPilot team}
      OUTREACH_ENFORCE_WINDOW: ${OUTREACH_ENFORCE_WINDOW:-true}
      ESCALATION_WEBHOOK_URL: ${ESCALATION_WEBHOOK_URL:-http://n8n:5678/webhook/escalation-alert}
    volumes:
      - ./api/app:/srv/app
      - ./prompts:/srv/prompts:ro
      - ./site:/srv/site:ro
      - ./db:/srv/db:ro
      - ./evals:/srv/evals
      - ./scripts:/srv/scripts
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  n8n:
    image: n8nio/n8n
    # Optional orchestration layer: all core logic lives in the API, so the API runs fine without this.
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      API_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      GENERIC_TIMEZONE: Asia/Manila
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    # Import and publish the exported workflows on every start so `docker compose up` is all it takes.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:workflow --separate --input=/workflows &&
        for f in /workflows/*.json; do n8n publish:workflow --id=$$(basename $$f .json); done;
        exec n8n start
    ports: ["5679:5678"]
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on: [api, mailpit]

  # Google Maps scraper (https://github.com/gosom/google-maps-scraper, MIT). Opt in: `docker compose --profile scraper up -d scraper`
  # First start downloads a browser into the playwright cache volume.
  scraper:
    image: gosom/google-maps-scraper
    profiles: ["scraper"]
    command: ["-web", "-addr", ":8080", "-data-folder", "/gmapsdata", "-c", "2"]
    environment:
      DISABLE_TELEMETRY: "1"
    volumes:
      - gmaps-data:/gmapsdata
      - gmaps-playwright-cache:/opt
    ports: ["8081:8080"]

volumes:
  pgdata:
  gmaps-data:
  gmaps-playwright-cache:
  n8ndata:
